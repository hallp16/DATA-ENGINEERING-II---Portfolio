
services:
  postgres_db:
    image: postgres:14.12
    container_name: traffic_postgres
    restart: always
    environment:      
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:      
      - "5432:5432"
    volumes:      
      - postgres_data:/var/lib/postgresql/data
    healthcheck:      
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5  
  
  ingestion_service:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: traffic_ingestion
    depends_on:     
      postgres_db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres_db
    volumes:    
      - ./data:/app/data  
  
  spark_processing:
    image: apache/spark:3.5.1
    container_name: traffic_spark
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      SPARK_MODE: master
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres_db
    volumes:      
      - ./spark_job:/app
volumes: 
  postgres_data: